# Local development services for AMR Viajes: PostgreSQL 17, Redis Streams queue and S3 storage (D09, D17).
name: amr-viajes

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en infra/.env}
    ports:
      # Bound to 127.0.0.1 so only this machine can reach the database, not the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # appendonly keeps queued verification jobs on disk, so a restart does not lose receipts waiting for the verifier.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en infra/.env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:4.51
    # "mini" runs every SeaweedFS component in one process; it creates the bucket on startup.
    # With credentials set, anonymous requests get 403: the bucket is private.
    command: ["mini", "-dir=/data", "-bucket=${S3_BUCKET:?Falta S3_BUCKET en infra/.env}", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Falta S3_ACCESS_KEY en infra/.env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Falta S3_SECRET_KEY en infra/.env}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:
