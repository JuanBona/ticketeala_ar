<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rendición de gastos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e0e5ec}
a{color:#5b4ae0}a:hover{color:#4a3bc4}
.nm-card{background:#e0e5ec;border-radius:20px;box-shadow:5px 5px 10px #b8bcc2,-5px -5px 10px #ffffff}
.nm-well{background:#e0e5ec;border-radius:14px;box-shadow:inset 3px 3px 6px #b8bcc2,inset -3px -3px 6px #ffffff}
.nm-btn{background:#e0e5ec;color:#333333;border:0;border-radius:12px;box-shadow:4px 4px 8px #b8bcc2,-4px -4px 8px #ffffff;transition:box-shadow .3s ease-in-out,color .3s ease-in-out;cursor:pointer;font-family:inherit;font-weight:700;text-decoration:none}
.nm-btn:hover{box-shadow:2px 2px 4px #b8bcc2,-2px -2px 4px #ffffff;color:#333333}
.nm-btn:active{box-shadow:inset 3px 3px 6px #b8bcc2,inset -3px -3px 6px #ffffff;color:#5b4ae0}
.nm-primary,.nm-primary:hover{background:#6d5dfc;color:#ffffff}
.nm-primary:active{box-shadow:inset 3px 3px 6px #5446d4,inset -3px -3px 6px #8a7cff;color:#ffffff}
.nm-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#333333;background:#e0e5ec;box-shadow:2px 2px 4px #b8bcc2,-2px -2px 4px #ffffff;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.mono{font-family:'IBM Plex Mono',monospace}
.icon-btn{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#4b5563;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:box-shadow .3s ease-in-out,color .3s ease-in-out}
.icon-btn:hover{color:#b33a3a}
.icon-btn:active{box-shadow:inset 3px 3px 6px #b8bcc2,inset -3px -3px 6px #ffffff}
:focus-visible{outline:2px solid #6d5dfc;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #e0e5ec; color: #333333; font-family: 'Nunito', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; gap: 16px; padding: 24px 20px 22px; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between">
<a class="nm-btn" href="Mobile-Inicio.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span class="nm-chip" style="font-size: 12px"><span class="dot" style="background: #ffe66d"></span>Borrador</span>
</div>

<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; color: #4b5563">R-0418 · 24–27 oct</span>
<h1 style="margin: 0; font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -0.03em">Buenos Aires</h1>
</div>

<div class="nm-card" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 8px">
<div style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 14px">Saldo a devolver</span><span style="font-size: 12px; color: #4b5563">adelanto − rendido</span></div>
<span class="mono" style="font-size: 30px; letter-spacing: -0.03em; color: #5b4ae0">{{saldo}}</span>
</div>
<div class="nm-well" style="height: 12px; border-radius: 999px; padding: 2px; box-sizing: border-box"><div style="{{barStyle}}"></div></div>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: #4b5563">
<span>Rendido <span class="mono" style="color: #333333">{{rendido}}</span></span>
<span>Adelanto <span class="mono" style="color: #333333">$ 600.000</span></span>
</div>
</div>

<div class="nm-card" style="display: flex; flex-direction: column; padding: 2px 6px 2px 16px">
<sc-for list="{{items}}" as="g" hint-placeholder-count="5">
<div style="{{g.rowStyle}}">
<div style="display: flex; flex-direction: column; flex: 1; min-width: 0"><span style="font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px">{{g.desc}}<sc-if value="{{g.alert}}" hint-placeholder-val="{{ false }}"><span class="nm-chip"><span class="dot" style="background: #ff6b6b"></span>Sin CAE</span></sc-if></span><span style="font-size: 12px; color: #4b5563">{{g.tipo}} · {{g.fecha}}</span></div>
<span class="mono" style="font-size: 14px">{{g.montoTxt}}</span>
<button type="button" class="icon-btn" onClick="{{g.del}}" aria-label="{{g.aria}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
</div>
</sc-for>
</div>

<a class="nm-btn" href="Mobile-OCR.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b4ae0" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Escanear comprobante</a>

<button type="button" class="nm-btn nm-primary" style="margin-top: auto; min-height: 54px; font-size: 16px">Presentar rendición</button>

<sc-if value="{{hasUndo}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 20px; right: 20px; bottom: 92px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 16px; background: #f0f0f3; box-shadow: 6px 6px 14px #b8bcc2,-6px -6px 14px #ffffff">
<span style="flex: 1; font-size: 14px">{{undoText}}</span>
<button type="button" class="nm-btn" onClick="{{undo}}" style="min-height: 44px; padding: 0 14px; font-size: 14px; color: #5b4ae0">Deshacer</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var G = [
  { id: 'g1', desc: 'Hotel · 3 noches', tipo: 'Alojamiento', fecha: '24/10', monto: 342000 },
  { id: 'g2', desc: 'Traslado aeropuerto', tipo: 'Transporte', fecha: '24/10', monto: 28500 },
  { id: 'g3', desc: 'Almuerzo', tipo: 'Comida', fecha: '25/10', monto: 48320, alert: true },
  { id: 'g4', desc: 'Cena con operadores', tipo: 'Comida', fecha: '25/10', monto: 61520 },
  { id: 'g5', desc: 'Movilidad urbana', tipo: 'Transporte', fecha: '24–27/10', monto: 32000 }
];
var ADEL = 600000;
function f(n) { return '$ ' + n.toLocaleString('es-AR'); }
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { gone: {}, last: null }; }
  renderVals() {
    var self = this, S = this.state;
    var live = G.filter(function (g) { return !S.gone[g.id]; });
    var total = live.reduce(function (s, g) { return s + g.monto; }, 0);
    var lastG = S.last ? G.filter(function (g) { return g.id === S.last; })[0] : null;
    return {
      items: live.map(function (g, i) {
        return Object.assign({}, g, {
          montoTxt: f(g.monto), aria: 'Eliminar gasto ' + g.desc,
          rowStyle: 'display: flex; align-items: center; gap: 8px; min-height: 54px;' + (i < live.length - 1 ? ' border-bottom: 1px solid #cbd1da' : ''),
          del: function () { var n = Object.assign({}, self.state.gone); n[g.id] = true; self.setState({ gone: n, last: g.id }); }
        });
      }),
      rendido: f(total), saldo: f(Math.abs(ADEL - total)),
      barStyle: 'height: 100%; border-radius: 999px; background: #6d5dfc; width: ' + Math.min(100, Math.round(total / ADEL * 100)) + '%',
      hasUndo: !!lastG,
      undoText: lastG ? 'Eliminaste ' + lastG.desc.toLowerCase() + ' · totales recalculados' : '',
      undo: function () { var n = Object.assign({}, self.state.gone); delete n[self.state.last]; self.setState({ gone: n, last: null }); }
    };
  }
}
</script>
</body>
</html>
