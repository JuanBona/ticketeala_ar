# Proyecto del motor de verificación de comprobantes (services/verifier).
[project]
name = "amr-verifier"
version = "0.1.0"
description = "Motor de verificación de comprobantes de AMR Viajes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.12",
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jsonschema>=4.23",
    "httpx2>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
